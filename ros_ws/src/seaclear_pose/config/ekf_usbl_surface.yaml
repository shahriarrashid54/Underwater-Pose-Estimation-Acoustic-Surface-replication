# Section V scenario: IMU + USBL + intermittent surface position fix.
# DVL removed (per paper, "we remove the DVL from the UUV due to its high cost").

imu0: /rexrov/imu
imu0_config: [false, false, false,
              true,  true,  true,
              false, false, false,
              true,  true,  true,
              true,  true,  true]
imu0_differential: false
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true

pose0: /seaclear/usbl_pose
pose0_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
pose0_differential: false
pose0_queue_size: 5

pose1: /seaclear/depth_pose
pose1_config: [false, false, true,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
pose1_differential: false
pose1_queue_size: 5

# Intermittent surface fix (sigma = 0.05 m on x, y, z); period set per launch.
pose2: /seaclear/surface_pose
pose2_config: [true,  true,  true,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
pose2_differential: false
pose2_queue_size: 5
pose2_rejection_threshold: 10.0
