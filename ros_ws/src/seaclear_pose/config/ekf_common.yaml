#   Q = diag( 1e-3 1e-3 1e-3  0.3 0.3 0.3  0.5 0.5 0.1  0.3 0.3 0.3  0.3 0.3 0.3 )
# Order follows robot_localization 15-state convention:
#   x y z  roll pitch yaw  vx vy vz  vroll vpitch vyaw  ax ay az

