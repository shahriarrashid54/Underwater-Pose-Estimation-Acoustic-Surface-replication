# Configuration: IMU only (+ depth from pressure).
# robot_localization sensor flag order:
#   [ x,     y,     z,     roll, pitch, yaw,
#     vx,    vy,    vz,    vroll, vpitch, vyaw,
#     ax,    ay,    az ]

# IMU: orientation, angular velocity, linear acceleration.
imu0: /rexrov/imu
imu0_config: [false, false, false,
              true,  true,  true,
              false, false, false,
              true,  true,  true,
              true,  true,  true]
imu0_nodelay: false
imu0_differential: false
imu0_relative: false
imu0_queue_size: 10
imu0_pose_rejection_threshold: 0.8
imu0_twist_rejection_threshold: 0.8
imu0_linear_acceleration_rejection_threshold: 0.8
imu0_remove_gravitational_acceleration: true

# Depth from pressure -> z position only.
pose0: /seaclear/depth_pose
pose0_config: [false, false, true,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
pose0_differential: false
pose0_relative: false
pose0_queue_size: 5
pose0_rejection_threshold: 5.0
pose0_nodelay: false
